name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prüft, dass gradle-wrapper.jar wirklich ein offizielles Gradle-Artefakt
      # ist und niemand einen manipulierten Wrapper eingeschleust hat.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: donutmarket-dev-build
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload sources jar
        uses: actions/upload-artifact@v4
        with:
          name: donutmarket-sources
          path: build/libs/*-sources.jar
          if-no-files-found: warn
          retention-days: 14
